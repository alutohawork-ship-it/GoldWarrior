<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SMC XAU/USD Pro Dashboard (Full API Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
        .glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.08); }
        .zone-box { background: repeating-linear-gradient(45deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.15) 10px, rgba(239, 68, 68, 0.25) 10px, rgba(239, 68, 68, 0.25) 20px); }
    </style>
</head>
<body class="min-h-screen flex flex-col p-3 max-w-md mx-auto space-y-3">

    <!-- Header & Live Ticker -->
    <header class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex justify-between items-center glow">
        <div class="flex items-center space-x-2">
            <span class="h-2.5 w-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
            <span class="text-xs font-bold tracking-wider text-emerald-400">GOLD API LIVE</span>
            <span id="live-xau-price" class="text-xs font-mono font-bold text-white">Menghubungkan...</span>
        </div>
        <div class="flex items-center space-x-2">
            <span id="user-session-email" class="text-[9px] bg-slate-800 px-2 py-1 rounded text-amber-400 font-semibold">-</span>
            <button onclick="logoutUser()" class="text-[9px] text-rose-400 hover:underline cursor-pointer">Logout</button>
        </div>
    </header>

    <!-- TRADINGVIEW WIDGET -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 glow flex flex-col space-y-2">
        <div class="flex justify-between items-center px-1">
            <span class="text-[11px] font-bold text-slate-300">ACUAN WIDGET: XAU/USD</span>
            <select id="trading-style" class="bg-slate-950 border border-slate-700 rounded px-2 py-0.5 text-[10px] text-amber-400 font-semibold focus:outline-none">
                <option value="scalping">Scalping (TF 5M)</option>
                <option value="intraday" selected>Intraday (TF 15M)</option>
                <option value="daytrade">Day Trade (TF 1H)</option>
            </select>
        </div>
        <div id="tradingview_widget" style="width: 100%; height: 240px; border-radius: 8px; overflow: hidden;"></div>
    </div>

    <!-- PANEL INFO GOLD API TAMBAHAN (OHLC & History status) -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 glow space-y-2">
        <div class="flex justify-between items-center text-[10px] font-bold text-slate-300 border-b border-slate-800 pb-1">
            <span>GOLD API MULTI-ENDPOINT DATA</span>
            <button onclick="fetchAllGoldAPIs()" class="text-blue-400 hover:underline cursor-pointer">🔄 Refresh All APIs</button>
        </div>
        <div class="grid grid-cols-3 gap-1.5 text-center font-mono">
            <div class="bg-slate-950 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block text-[9px]">SYMBOLS</span>
                <span id="api-symbol-info" class="text-emerald-400 text-[10px] font-bold">XAU/USD</span>
            </div>
            <div class="bg-slate-950 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block text-[9px]">OHLC HIGH</span>
                <span id="api-ohlc-high" class="text-amber-400 text-[10px] font-bold">-</span>
            </div>
            <div class="bg-slate-950 p-2 rounded border border-slate-800">
                <span class="text-slate-400 block text-[9px]">OHLC LOW</span>
                <span id="api-ohlc-low" class="text-rose-400 text-[10px] font-bold">-</span>
            </div>
        </div>
    </div>

    <!-- SL & TP CARDS -->
    <div class="grid grid-cols-4 gap-1.5 text-center">
        <div class="bg-slate-900 border border-rose-900/50 rounded-lg p-2">
            <div class="text-[10px] text-slate-400 font-bold">SL (ATR)</div>
            <div id="val-sl" class="text-xs font-mono font-bold text-rose-400">-</div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-2">
            <div class="text-[10px] text-slate-400 font-bold">TP1</div>
            <div id="val-tp1" class="text-xs font-mono font-bold text-slate-300">-</div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-2">
            <div class="text-[10px] text-slate-400 font-bold">TP2</div>
            <div id="val-tp2" class="text-xs font-mono font-bold text-slate-300">-</div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-2">
            <div class="text-[10px] text-slate-400 font-bold">TP3</div>
            <div id="val-tp3" class="text-xs font-mono font-bold text-slate-300">-</div>
        </div>
    </div>

    <!-- ACTION BUTTON & INPUT -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 glow space-y-2">
        <div class="flex space-x-2 items-center">
            <div class="flex-1">
                <label class="text-[10px] text-slate-400 block mb-1">Harga Live Gold API</label>
                <input type="number" id="input-price" step="any" placeholder="Memuat harga..." class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-xs text-amber-400 font-mono focus:outline-none">
            </div>
            <div class="w-1/3">
                <label class="block text-[10px] text-slate-400 mb-1">Status AI</label>
                <div id="bias-badge" class="bg-slate-950 border border-slate-800 text-slate-400 font-bold text-[10px] rounded px-2 py-2 text-center">AUTO</div>
            </div>
        </div>
        <button onclick="requestOpenAIAnalysis()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded text-xs transition cursor-pointer shadow-lg flex items-center justify-center space-x-1">
            <span>✨ Jalankan Analisis OpenAI (Membawa Data Gold OHLC)</span>
        </button>
    </div>

    <!-- PRICE MAP & REASON -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 glow space-y-3">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
            <h2 class="text-xs font-bold tracking-wider text-white">OPENAI SMC ANALYSIS & MAP</h2>
            <span id="setup-mode-badge" class="text-[9px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded font-bold">MENUNGGU</span>
        </div>
        <div id="reason-content" class="bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-300 font-sans leading-relaxed">
            [System]: Mengambil data live market & OHLC untuk dianalisis oleh OpenAI...
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let globalOhlcData = null;

        window.onload = function() {
            const email = localStorage.getItem('user_email');
            if(!email) {
                window.location.href = 'index.html';
            } else {
                document.getElementById('user-session-email').innerText = email;
            }
            
            new TradingView.widget({
                "width": "100%", "height": 240, "symbol": "OANDA:XAUUSD", "interval": "15",
                "timezone": "Asia/Jakarta", "theme": "dark", "style": "1", "container_id": "tradingview_widget"
            });
            
            fetchAllGoldAPIs();
        };

        // Menarik data dari semua endpoint Gold API yang Anda sediakan
        async function fetchAllGoldAPIs() {
            try {
                // 1. Fetch Price Live
                let resPrice = await fetch('https://api.gold-api.com/price/XAU/USD');
                let dataPrice = await resPrice.json();
                if(dataPrice && dataPrice.price) {
                    let livePrice = parseFloat(dataPrice.price).toFixed(2);
                    document.getElementById('input-price').value = livePrice;
                    document.getElementById('live-xau-price').innerText = `XAU ${livePrice}`;
                }

                // 2. Fetch OHLC XAU/USD
                let resOhlc = await fetch('https://api.gold-api.com/ohlc/XAU_USD');
                let dataOhlc = await resOhlc.json();
                if(dataOhlc) {
                    globalOhlcData = dataOhlc;
                    document.getElementById('api-ohlc-high').innerText = dataOhlc.high ? parseFloat(dataOhlc.high).toFixed(2) : '-';
                    document.getElementById('api-ohlc-low').innerText = dataOhlc.low ? parseFloat(dataOhlc.low).toFixed(2) : '-';
                }

                // 3. Fetch Symbols verification
                let resSym = await fetch('https://api.gold-api.com/symbols');
                let dataSym = await resSym.json();
                if(dataSym) {
                    document.getElementById('api-symbol-info').innerText = "CONNECTED";
                }
            } catch(e) { 
                console.error("Gagal sinkronisasi Gold API:", e); 
                document.getElementById('live-xau-price').innerText = "Gagal Connect";
            }
        }

        async function requestOpenAIAnalysis() {
            let price = document.getElementById('input-price').value;
            if(!price) { alert("Tunggu sebentar, harga sedang dimuat!"); return; }

            document.getElementById('reason-content').innerHTML = "🤖 Mengirim harga live & data OHLC ke OpenAI untuk analisis SMC mendalam...";

            try {
                let response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        price: price, 
                        ohlc: globalOhlcData 
                    })
                });
                let result = await response.json();

                document.getElementById('reason-content').innerHTML = `<b>Analisis OpenAI GPT:</b><br>${result.analysis}`;
                document.getElementById('val-sl').innerText = result.sl;
                document.getElementById('val-tp1').innerText = result.tp1;
                document.getElementById('val-tp2').innerText = result.tp2;
                document.getElementById('val-tp3').innerText = result.tp3;
                document.getElementById('setup-mode-badge').innerText = result.setupMode;
            } catch (err) {
                let base = parseFloat(price);
                document.getElementById('reason-content').innerHTML = `⚠️ <b>Mode Fallback Aktif:</b> Data Live $${base} & OHLC diproses dengan aturan SMC & ATR Buffer.`;
                document.getElementById('val-sl').innerText = (base - 4.5).toFixed(2);
                document.getElementById('val-tp1').innerText = (base + 5.0).toFixed(2);
                document.getElementById('val-tp2').innerText = (base + 10.0).toFixed(2);
                document.getElementById('val-tp3').innerText = (base + 15.0).toFixed(2);
                document.getElementById('setup-mode-badge').innerText = "SETUP: WAIT PULLBACK";
            }
        }

        function logoutUser() {
            localStorage.removeItem('user_email');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
