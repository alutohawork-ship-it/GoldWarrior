<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alu Signal · Uji Coba</title>
<style>
:root { color-scheme: dark; --bg:#0b0f14; --panel:#131a22; --line:#243041; --txt:#e6edf3; --muted:#8b98a8; --buy:#20c997; --sell:#ff6b6b; --warn:#f7b84b; --ok:#3ddc97; --bad:#ff6b6b; }
* { box-sizing: border-box; }
body { margin:0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--txt); padding: 0 12px 24px; }
.wrap { max-width: 760px; margin: 0 auto; }
h1 { font-size: 18px; margin: 16px 0 4px; }
.sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
.row.between { justify-content: space-between; align-items: center; }
label { font-size: 12px; color: var(--muted); display:flex; flex-direction:column; gap:4px; flex: 1 1 140px; }
input, select { background:#0e141b; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:15px; width:100%; }
button { background:#1f2a38; color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:15px; min-height:44px; cursor:pointer; }
button.primary { background:#1d4ed8; border-color:#1d4ed8; }
button.danger { background:#7f1d1d; border-color:#7f1d1d; }
.side { font-size: 28px; font-weight: 800; letter-spacing: 1px; }
.side.buy { color: var(--buy); }
.side.sell { color: var(--sell); }
.side.standby { color: var(--muted); }
.badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; border:1px solid var(--line); color: var(--muted); }
.badge.running { color: var(--ok); border-color: var(--ok); }
.badge.pending { color: var(--warn); border-color: var(--warn); }
.grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
.kv { background:#0e141b; border:1px solid var(--line); border-radius:8px; padding:8px; }
.kv span { display:block; color: var(--muted); font-size: 11px; }
.kv b { font-size: 16px; font-variant-numeric: tabular-nums; word-break: break-all; }
ul.check { list-style:none; padding:0; margin:8px 0 0; font-size:13px; }
ul.check li { padding:5px 0; border-bottom:1px dashed var(--line); }
li.ok { color: var(--ok); }
li.bad { color: var(--bad); }
li.info { color: var(--muted); }
.err { color: var(--bad); font-size: 13px; min-height: 1.2em; margin-top: 6px; }
.muted { color: var(--muted); }
table { width:100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align:left; padding:5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Alu Signal · Uji Coba</h1>
  <div class="sub">Halaman uji untuk endpoint /api/generate. Hanya untuk pengujian, bukan saran finansial.</div>

  <div class="panel">
    <div class="row">
      <label>Simbol<input id="symbol" value="XAUUSD" autocomplete="off"></label>
      <label>Mode
        <select id="mode"><option value="bot" selected>Bot (auto)</option><option value="manual">Manual</option></select>
      </label>
      <label>Gaya (manual)
        <select id="style"><option>Scalping</option><option>Intraday</option><option>Swing</option></select>
      </label>
      <label>Bahasa
        <select id="lang"><option value="id" selected>Indonesia</option><option value="en">English</option></select>
      </label>
      <label>Interval (detik)<input id="interval" type="number" min="5" value="15"></label>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="toggle" class="primary" type="button">Mulai</button>
      <button id="once" type="button">Ambil sekali</button>
      <button id="reset" class="danger" type="button">Reset</button>
    </div>
    <div id="status" class="muted" style="margin-top:8px;font-size:12px">Belum jalan.</div>
    <div id="err" class="err"></div>
  </div>

  <div class="panel">
    <div class="row between">
      <div id="side" class="side standby">—</div>
      <span id="badge" class="badge">—</span>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <div class="panel">
    <div class="row between">
      <b>Penjelasan</b>
      <span id="reasonSrc" class="muted" style="font-size:12px"></span>
    </div>
    <p id="reason" style="margin:8px 0 0; white-space:pre-wrap">—</p>
  </div>

  <div class="panel">
    <b>Checklist</b>
    <ul id="checklist" class="check"></ul>
  </div>

  <div class="panel">
    <b>Kestabilan sinyal</b>
    <div id="stats" class="muted" style="font-size:13px; margin-top:6px">—</div>
  </div>

  <div class="panel">
    <b>Riwayat polling (30 terakhir)</b>
    <div style="overflow-x:auto; margin-top:6px">
      <table>
        <thead><tr><th>Jam</th><th>Status</th><th>Sinyal</th><th>Entry</th><th>Sticky</th><th>Waktu</th></tr></thead>
        <tbody id="log"></tbody>
      </table>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
