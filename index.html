<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI SMC XAU/USD Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
        .glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.08); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm glow space-y-4">
        <div class="text-center space-y-1">
            <h1 class="text-sm font-bold text-white tracking-wider">AI SMC XAU/USD PRO</h1>
            <p class="text-[10px] text-slate-400">Masukkan email Anda untuk akses Trial / Lifetime</p>
        </div>

        <div class="space-y-3">
            <div>
                <label class="block text-[10px] text-slate-400 mb-1">Alamat Email</label>
                <input type="email" id="user-email" placeholder="trader@email.com" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-xs text-amber-400 font-mono focus:outline-none focus:border-amber-500">
            </div>
            
            <button onclick="handleAuth()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded text-xs transition cursor-pointer shadow-lg">Masuk / Daftar</button>
            
            <div class="text-[9px] text-slate-500 text-center leading-relaxed">
                Akses penuh ke Gold API (Live, OHLC, History) & OpenAI SMC Engine.
            </div>
        </div>
    </div>

    <script>
        function handleAuth() {
            const email = document.getElementById('user-email').value.trim();
            if(!email || !email.includes('@')) {
                alert('Masukkan alamat email yang valid!');
                return;
            }
            localStorage.setItem('user_email', email);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
