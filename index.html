<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI SMC XAU/USD Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
        .glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.08); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm glow space-y-4">
        <div class="text-center space-y-1">
            <h1 class="text-sm font-bold text-white tracking-wider">AI SMC XAU/USD PRO</h1>
            <p class="text-[10px] text-slate-400">Masukkan email terdaftar untuk akses</p>
        </div>

        <div class="space-y-3">
            <div>
                <label class="block text-[10px] text-slate-400 mb-1">Alamat Email</label>
                <input type="email" id="user-email" placeholder="client@email.com" class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-xs text-amber-400 font-mono focus:outline-none focus:border-amber-500">
            </div>
            
            <button onclick="handleLogin()" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded text-xs transition cursor-pointer shadow-lg">Masuk Dashboard</button>
            
            <div id="login-error" class="text-[10px] text-rose-400 text-center font-semibold"></div>
            
            <div class="text-[9px] text-slate-500 text-center leading-relaxed pt-2 border-t border-slate-800">
                Belum terdaftar? Silakan hubungi Admin untuk mendapatkan akses Trial atau Lifetime.
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ytmyvxteokyqquzfhhvh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0bXl2eHRlb2t5cXF1emZoaHZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2MzA2NjcsImV4cCI6MjEwOTIwNjY2N30.gIOrqhhxzAJI0BiPfJw62wCx6eLNOSiWCSoSt1vgQ1Q';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleLogin() {
            const email = document.getElementById('user-email').value.trim();
            const errDiv = document.getElementById('login-error');
            errDiv.innerText = "";

            if(!email || !email.includes('@')) {
                errDiv.innerText = 'Masukkan email yang valid!';
                return;
            }

            document.getElementById('btn-login').innerText = "Memeriksa Akses...";

            let { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('email', email)
                .single();

            if (error || !data) {
                errDiv.innerText = 'Email belum didaftarkan oleh Admin!';
                document.getElementById('btn-login').innerText = "Masuk Dashboard";
                return;
            }

            localStorage.setItem('user_email', data.email);
            localStorage.setItem('user_role', data.role);
            localStorage.setItem('user_status', data.status);

            if (data.role === 'admin') {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
